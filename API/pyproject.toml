[project]
name = "editor-videos"
version = "0.1.0"
description = "Agente local que edita clipes em um vídeo vertical 1080x1920 com cortes, legendas, reenquadramento, zooms e imagens."
readme = "etapas.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2",
    "mediapipe>=0.10.20",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "natsort>=8.4",
    # `langchain` só fornece `init_chat_model`; nada de agents/chains/memória.
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "requests>=2.32",
    "rembg[cpu]>=2.0.60",
    "fastapi[standard]>=0.115",
    "fonttools>=4.40",
]

[project.optional-dependencies]
# Bibliotecas CUDA para o faster-whisper (CTranslate2) rodar na GPU no Windows.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: usa vídeos reais em samples/, GPU ou rede (lento)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
